spring.application.name=contabot-api
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/contabot;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
spring.jackson.serialization.write-dates-as-timestamps=false
app.cors.allowed-origins=http://localhost:4200,http://localhost:3000
app.jwt.secret=${APP_JWT_SECRET:contabilit-chave-secreta-de-desenvolvimento-troque-em-producao}
app.jwt.expiracao-ms=28800000
app.storage.path=./storage
