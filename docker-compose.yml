version: '3.8'

services:
  backend-spring:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contabilit-spring-boot
    ports:
      - "8080:8080"
    environment:
      - APP_JWT_SECRET=contabilit-chave-secreta-de-desenvolvimento-troque-em-producao
    volumes:
      - contabot-data:/app/data
      - contabot-storage:/app/storage

volumes:
  contabot-data:
  contabot-storage:
